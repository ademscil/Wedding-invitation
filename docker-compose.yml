version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://wedinvite:secretpassword@postgres:5432/wedinvite?sslmode=disable
      - NEXTAUTH_SECRET=local-docker-secret-replace-in-prod-min-32-chars
      - NEXTAUTH_URL=http://localhost:3000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: wedinvite
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: wedinvite
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wedinvite -d wedinvite']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

